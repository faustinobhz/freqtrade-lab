name: freqtrade-lab
services:
  freqtrade:
    image: ${FREQTRADE_IMAGE:?Execute python3 scripts/lab.py init}
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./user_data:/freqtrade/user_data
      - ./.private/config.json:/freqtrade/config.json:ro
      - ./user_data/strategies:/freqtrade/user_data/strategies:ro
    environment:
      FREQTRADE__DRY_RUN: "true"
      FREQTRADE__FORCE_ENTRY_ENABLE: "false"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 60s
    command:
      - trade
      - --config
      - /freqtrade/config.json
      - --strategy
      - ObserveStrategy
      - --db-url
      - sqlite:////freqtrade/user_data/tradesv3.dryrun.sqlite
      - --logfile
      - /freqtrade/user_data/logs/freqtrade.log
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v1/ping', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
