name: Validar laboratorio
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q scripts user_data/strategies
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/lab.py init
      - run: python scripts/lab.py check
      - name: Verificar carregamento da estrategia na imagem oficial
        run: |
          docker compose run --rm freqtrade list-strategies --config /freqtrade/config.json --strategy-path /freqtrade/user_data/strategies --print-json > /tmp/strategies.json
          python -c "import json; names = json.load(open('/tmp/strategies.json')); assert 'ObserveStrategy' in names, names; print('PASS: ObserveStrategy importada na imagem oficial')"
      - name: Limpar credenciais efemeras
        if: always()
        run: rm -rf .private .env
